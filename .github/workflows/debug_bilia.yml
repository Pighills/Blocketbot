name: Debug Bilia-sida

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install httpx
      - name: Run diagnostic
        run: python scripts/debug_vcr.py
      - name: Commit debug output
        run: |
          git config user.name "blocket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Debug-dump for bilia.se"
          git push
